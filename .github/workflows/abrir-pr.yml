name: Abrir PR de aporte

on:
  push:
    branches:
      - 'aporte/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: abrir-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  abrir:
    if: startsWith(github.ref, 'refs/heads/aporte/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RAMA: ${{ github.ref_name }}
    steps:
      - name: Abrir PR y enlazar el issue del responsable, si la rama coincide con la convención
        shell: python
        run: |
          import json
          import os
          import subprocess
          from pathlib import Path

          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True).strip()

          tareas = {
              'aporte/cristian-ango': ('Cristian Ango', 'Plan de evaluación'),
              'aporte/oscar-riofrio': ('Oscar Riofrio', 'Consentimiento informado'),
              'aporte/julio-jacho': ('Julio Jacho', 'Seis tareas de usabilidad'),
              'aporte/matias-morales': ('Matias Morales', 'Hoja de observación y SUS'),
          }
          rama = os.environ['RAMA']
          repo = os.environ['GH_REPO']
          comparacion = json.loads(gh('api', f'repos/{repo}/compare/main...{rama}'))
          if not comparacion.get('files'):
              print('La rama no tiene cambios frente a main; no requiere PR.')
              raise SystemExit(0)

          if rama in tareas:
              nombre, tarea = tareas[rama]
              titulo = f'APE6 Fase 1: {nombre} — {tarea}'
              issues = json.loads(gh('issue', 'list', '--state', 'open', '--limit', '1000', '--json', 'title,number'))
              issue = next((i['number'] for i in issues if i['title'] == titulo), None)
              cuerpo = f'Responsable: {nombre}\n\n{tarea} para la Fase 1 de APE 6. Revisar el archivo agregado en docs/ y su contenido.\n\n'
              cuerpo += f'Closes #{issue}\n\n' if issue else 'Issue pendiente de creación o de enlace manual.\n\n'
          else:
              titulo = f'Aporte de Fase 1 ({rama})'
              cuerpo = 'Rama sin convención conocida (aporte/<nombre>); enlazar el issue manualmente en este PR.\n\n'

          cuerpo += 'Pendiente de revisión por el equipo. No se fusiona automáticamente.'
          archivo = Path(os.environ['RUNNER_TEMP']) / 'cuerpo-pr.md'
          archivo.write_text(cuerpo, encoding='utf-8')
          abiertos = json.loads(gh('pr', 'list', '--base', 'main', '--head', rama, '--state', 'open', '--json', 'number,url'))
          if abiertos:
              print('El PR existente recibe los nuevos commits:', abiertos[0]['url'])
          else:
              print(gh('pr', 'create', '--base', 'main', '--head', rama, '--title', titulo, '--body-file', str(archivo)))
